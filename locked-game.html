<script>

function clean(el){if(!el)return;el.style.setProperty('background','rgba(255,255,255,.001)','important');el.style.setProperty('background-image','none','important');el.style.setProperty('border','0','important');el.style.setProperty('box-shadow','none','important');el.style.setProperty('color','transparent','important');el.style.setProperty('text-shadow','none','important');el.style.setProperty('font-size','0','important');el.style.setProperty('outline','none','important');el.style.setProperty('-webkit-appearance','none','important');el.style.setProperty('appearance','none','important')}

function spans(d,id,xs,y,host){let p=d.getElementById(id);if(!p){p=d.createElement('div');p.id=id;host.appendChild(p);xs.forEach((x,i)=>{const s=d.createElement('span');s.style.left=x+'%';s.style.top=y+'%';s.dataset.i=i;p.appendChild(s)})}return [...p.querySelectorAll('span')]}
function game4(d){const host=d.getElementById('g4');if(!host)return;d.querySelectorAll('.g4UniqueClue45184').forEach(x=>x.remove());const ins=[...host.querySelectorAll('input')].slice(0,5);if(ins.length<5)return;const old=[...new Set(ins.map(x=>x.parentElement))],bx=[39.4,45.3,51.2,57.1,63],tx=[42.1,50.2,58.3,66.4,74.5];ins.forEach((x,i)=>{if(x.parentElement!==host)host.appendChild(x);x.className='cleanInput19';x.style.left=bx[i]+'%';x.style.top='79%';x.setAttribute('inputmode','numeric');x.setAttribute('pattern','[0-9]*');x.setAttribute('maxlength','1')});old.forEach(p=>{if(p&&p!==host&&!p.querySelector('input'))p.style.setProperty('display','none','important')});const top=spans(d,'g4MirrorTop19',tx,34.2,host),bot=spans(d,'g4MirrorBottom19',bx,79,host);const sync=()=>ins.forEach((x,i)=>{x.value=(x.value||'').replace(/\D/g,'').slice(0,1);top[i].textContent=x.value;bot[i].textContent=x.value});ins.forEach((x,i)=>{if(!x.dataset.clean19){x.dataset.clean19='1';x.addEventListener('input',()=>{sync();if(x.value&&i<4)ins[i+1].focus()});x.addEventListener('touchend',()=>setTimeout(()=>x.focus(),0),{passive:true})}});sync();const sub=host.querySelector('#g4Submit,#g4submit');if(sub){clean(sub);sub.onclick=e=>{if(e){e.preventDefault();e.stopPropagation()}sync();const code=ins.map(x=>x.value).join('');if(code.length<5){if(typeof d.defaultView.toast==='function')d.defaultView.toast('先填完 5 位数字');return false}if(code!=='45184'){if(typeof d.defaultView.toast==='function')d.defaultView.toast('密码不对，再看看线索');return false}if(typeof d.defaultView.go==='function')d.defaultView.go('g4hint');return false};if(!sub.dataset.touch19){sub.dataset.touch19='1';sub.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();sub.click()},{passive:false})}}}
function game5(d){
  const host=d.getElementById('g5');if(!host)return;
  const answer=d.getElementById('g5Answer');
  const keyboard=d.getElementById('keyboard');
  const submit=d.getElementById('g5Submit');
  if(!answer||!keyboard||!submit)return;
  const inputs=[...answer.querySelectorAll('input')].slice(0,6);
  inputs.forEach((inp,i)=>{
    inp.setAttribute('maxlength','1');inp.setAttribute('autocapitalize','characters');
    if(!inp.dataset.clean19){
      inp.dataset.clean19='1';
