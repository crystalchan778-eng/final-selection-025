<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>寻找藏起的你</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717}
#outer{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="outer" src="/wrapper-v13.html?v=line-dog-clean-15"></iframe>
<script>
(function(){
  const outer=document.getElementById('outer');

  function cleanButton(el){
    if(!el) return;
    el.style.setProperty('background','rgba(255,255,255,.001)','important');
    el.style.setProperty('background-image','none','important');
    el.style.setProperty('border','0','important');
    el.style.setProperty('box-shadow','none','important');
    el.style.setProperty('color','transparent','important');
    el.style.setProperty('text-shadow','none','important');
    el.style.setProperty('font-size','0','important');
    el.style.setProperty('outline','none','important');
    el.style.setProperty('-webkit-appearance','none','important');
    el.style.setProperty('appearance','none','important');
  }

  function getGameDoc(){
    try{
      const wrapper=outer.contentDocument;
      const inner=wrapper && wrapper.getElementById('game');
      return inner && inner.contentDocument ? inner.contentDocument : null;
    }catch(e){return null;}
  }

  function installStyle(d){
    if(d.getElementById('lineDogClean15')) return;
    const st=d.createElement('style');
    st.id='lineDogClean15';
    st.textContent=`
/* ===== CLEAN GAME 4 ===== */
#g4 .g4UniqueClue45184{display:none!important}
#g4 > .badge,#g4 .badge,#g4 [id*=Badge],#g4 [class*=badge]{display:none!important}
#g4 #g4Boxes,#g4 #g4squares{
  position:absolute!important;left:35.5%!important;top:75.7%!important;width:29.5%!important;height:8.7%!important;
  margin:0!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;
  display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:2.3%!important;z-index:100!important;pointer-events:auto!important
}
#g4 #g4Boxes input,#g4 #g4squares input{
  width:100%!important;height:100%!important;min-width:0!important;margin:0!important;padding:0!important;
  border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;outline:none!important;
  -webkit-appearance:none!important;appearance:none!important;text-align:center!important;
  font-size:clamp(18px,2.5vw,31px)!important;font-weight:900!important;line-height:1!important;color:#4e332b!important;
  caret-color:#4e332b!important;pointer-events:auto!important;touch-action:manipulation!important
}
#g4 #g4Submit,#g4 #g4submit{
  position:absolute!important;left:65.3%!important;top:75.4%!important;width:16.4%!important;height:9.2%!important;
  z-index:110!important;pointer-events:auto!important;touch-action:manipulation!important
}
#g4 #g4Back,#g4 #g4back,#g4 .back{z-index:115!important;pointer-events:auto!important}

/* Game 4 hint: artwork only, live controls invisible */
#g4hint #g4hintNext,#g4hint [id*=Next],#g4hint button{background:rgba(255,255,255,.001)!important;background-image:none!important;border:0!important;box-shadow:none!important;color:transparent!important;text-shadow:none!important;font-size:0!important;outline:none!important;-webkit-appearance:none!important;appearance:none!important}
#g4hint .badge,#g4hint [class*=badge]{display:none!important}

/* ===== CLEAN GAME 5 ===== */
#g5 > .badge,#g5 .badge,#g5 [id*=Badge],#g5 [class*=badge]{display:none!important}
#g5 #g5squares,#g5 #g5Boxes{
  position:absolute!important;left:26.8%!important;top:48.1%!important;width:47%!important;height:10%!important;
  margin:0!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;
  display:grid!important;grid-template-columns:repeat(6,1fr)!important;gap:2.1%!important;z-index:120!important;pointer-events:auto!important
}
#g5 #g5squares input,#g5 #g5Boxes input{
  width:100%!important;height:100%!important;min-width:0!important;margin:0!important;padding:0!important;
  border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;outline:none!important;
  -webkit-appearance:none!important;appearance:none!important;text-align:center!important;text-transform:uppercase!important;
  font-size:clamp(20px,2.8vw,34px)!important;font-weight:900!important;line-height:1!important;color:#cc3654!important;
  caret-color:#cc3654!important;pointer-events:auto!important;touch-action:manipulation!important
}
#g5 #g5Submit,#g5 #g5submit{
  position:absolute!important;left:35%!important;top:83.4%!important;width:31.2%!important;height:11.3%!important;
  z-index:145!important;pointer-events:auto!important;touch-action:manipulation!important
}
#g5 #g5Back,#g5 #g5back,#g5 .back{z-index:150!important;pointer-events:auto!important}
#g5CleanKeyboard{position:absolute!important;left:10.8%!important;top:59.4%!important;width:78.5%!important;height:19.7%!important;z-index:140!important;pointer-events:none!important}
#g5CleanKeyboard button{position:absolute!important;margin:0!important;padding:0!important;border:0!important;background:rgba(255,255,255,.001)!important;color:transparent!important;box-shadow:none!important;outline:none!important;pointer-events:auto!important;touch-action:manipulation!important;-webkit-appearance:none!important;appearance:none!important}
`;
    d.head.appendChild(st);
  }

  function hideLiveSingleLetterOverlays(d){
    const g5=d.getElementById('g5');
    if(!g5) return;
    const els=[...g5.querySelectorAll('*')];
    els.forEach(el=>{
      if(el.id==='g5CleanKeyboard' || el.closest('#g5CleanKeyboard')) return;
      if(el.tagName==='IMG' || el.tagName==='INPUT') return;
      const txt=(el.textContent||'').trim();
      if(/^[A-Z]$/.test(txt) && el.children.length===0){
        let target=el.closest('button') || el;
        let p=target;
        for(let i=0;i<2 && p && p!==g5;i++,p=p.parentElement){
          const pt=(p.textContent||'').trim();
          const r=p.getBoundingClientRect();
          if(pt===txt && r.width<180 && r.height<120){
            p.style.setProperty('background','transparent','important');
            p.style.setProperty('background-image','none','important');
            p.style.setProperty('border','0','important');
            p.style.setProperty('box-shadow','none','important');
            p.style.setProperty('color','transparent','important');
            p.style.setProperty('text-shadow','none','important');
            p.style.setProperty('pointer-events','none','important');
          }
        }
      }
      if(/^5\/6$/.test(txt) && el.children.length===0){
        const target=el.closest('button')||el;
        target.style.setProperty('display','none','important');
      }
    });
  }

  function makeG5Keyboard(d){
    const g5=d.getElementById('g5');
    if(!g5 || g5.querySelector('#g5CleanKeyboard')) return;
    const box=d.createElement('div');
    box.id='g5CleanKeyboard';
    const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    let active=0;
    const inputs=()=>[...d.querySelectorAll('#g5squares input,#g5Boxes input')].slice(0,6);

    inputs().forEach((inp,i)=>{
      inp.setAttribute('maxlength','1');
      inp.setAttribute('autocapitalize','characters');
      inp.addEventListener('focus',()=>{active=i;});
      inp.addEventListener('click',()=>{active=i;});
      inp.addEventListener('input',()=>{
        inp.value=(inp.value||'').replace(/[^A-Za-z]/g,'').slice(0,1).toUpperCase();
        if(inp.value && i<5) active=i+1;
      });
    });

    [...letters].forEach((letter,i)=>{
      const b=d.createElement('button');
      b.type='button';
      b.textContent=letter;
      const col=i%13, row=i<13?0:1;
      b.style.left=(col*(100/13))+'%';
      b.style.width=(100/13)+'%';
      b.style.top=(row===0?'0%':'51%');
      b.style.height='44%';
      const hit=function(e){
        e.preventDefault();e.stopPropagation();
        const ins=inputs(); if(!ins.length) return;
        if(active<0||active>5) active=0;
        if(ins[active].value){const blank=ins.findIndex(x=>!x.value); if(blank>=0) active=blank;}
        ins[active].value=letter;
        ins[active].dispatchEvent(new Event('input',{bubbles:true}));
        if(active<5) active++;
      };
      b.addEventListener('click',hit);
      b.addEventListener('touchend',hit,{passive:false});
      box.appendChild(b);
    });
    g5.appendChild(box);
  }

  function fixGame4(d){
    d.querySelectorAll('.g4UniqueClue45184').forEach(x=>x.remove());
    const inputs=[...d.querySelectorAll('#g4Boxes input,#g4squares input')].slice(0,5);
    inputs.forEach((inp,i)=>{
      inp.setAttribute('inputmode','numeric');
      inp.setAttribute('pattern','[0-9]*');
      inp.setAttribute('maxlength','1');
      if(!inp.dataset.clean15){
        inp.dataset.clean15='1';
        inp.addEventListener('input',()=>{
          inp.value=(inp.value||'').replace(/\D/g,'').slice(0,1);
          if(inp.value && i<inputs.length-1) inputs[i+1].focus();
        });
        inp.addEventListener('touchend',()=>setTimeout(()=>inp.focus(),0),{passive:true});
      }
    });
    const submit=d.querySelector('#g4Submit,#g4submit');
    if(submit){
      cleanButton(submit);
      submit.onclick=function(e){
        if(e){e.preventDefault();e.stopPropagation();}
        const code=inputs.map(x=>x.value).join('');
        if(code.length<5){if(typeof d.defaultView.toast==='function')d.defaultView.toast('先填完 5 位数字');return false;}
        if(code!=='45184'){if(typeof d.defaultView.toast==='function')d.defaultView.toast('密码不对，再看看线索');return false;}
        if(typeof d.defaultView.go==='function')d.defaultView.go('g4hint');
        return false;
      };
      if(!submit.dataset.clean15touch){
        submit.dataset.clean15touch='1';
        submit.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();submit.click();},{passive:false});
      }
    }
    cleanButton(d.querySelector('#g4Back,#g4back'));
    cleanButton(d.querySelector('#g4hintNext'));
  }

  function fixGame5(d){
    hideLiveSingleLetterOverlays(d);
    makeG5Keyboard(d);
    const submit=d.querySelector('#g5Submit,#g5submit');
    if(submit){
      cleanButton(submit);
      if(!submit.dataset.clean15touch){
        submit.dataset.clean15touch='1';
        submit.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();submit.click();},{passive:false});
      }
    }
    cleanButton(d.querySelector('#g5Back,#g5back'));
  }

  function patch(){
    const d=getGameDoc();
    if(!d) return false;
    installStyle(d);
    fixGame4(d);
    fixGame5(d);
    return true;
  }

  outer.addEventListener('load',function(){
    let tries=0;
    const timer=setInterval(function(){
      patch();
      if(++tries>120) clearInterval(timer);
    },250);
  });
})();
</script>
</body>
</html>
