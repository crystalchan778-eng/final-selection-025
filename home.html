<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Final Selection 026</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050609;overflow:hidden}
body{display:flex;justify-content:center;align-items:flex-start}
#game{display:block;border:0;background:#050609;width:min(100vw,calc(100svh * 9 / 16));height:min(100svh,calc(100vw * 16 / 9));max-width:520px}
@supports not (height:100svh){#game{width:min(100vw,calc(100vh * 9 / 16));height:min(100vh,calc(100vw * 16 / 9))}}
</style>
</head>
<body>
<iframe id="game" src="/index.html?v=7" allow="autoplay; camera; microphone" title="Final Selection 026"></iframe>
<script>
(function(){
 const frame=document.getElementById('game');
 frame.addEventListener('load',()=>{
   try{
     const doc=frame.contentDocument;
     if(!doc||doc.getElementById('phone-fit-v7')) return;
     const link=doc.createElement('link');
     link.id='phone-fit-v7'; link.rel='stylesheet'; link.href='/fit.css?v=7';
     doc.head.appendChild(link);
   }catch(e){console.error(e)}
 });
})();
</script>
</body>
</html>
