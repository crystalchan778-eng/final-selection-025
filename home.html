<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Final Selection 026</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050609;overflow:hidden}
body{display:flex;justify-content:center;align-items:flex-start}
#game{display:block;border:0;background:#050609;width:min(100vw,calc(100svh * 9 / 16));height:min(100svh,calc(100vw * 16 / 9));max-width:520px}
@supports not (height:100svh){#game{width:min(100vw,calc(100vh * 9 / 16));height:min(100vh,calc(100vw * 16 / 9))}}
</style>
</head>
<body>
<iframe id="game" src="/index.html?v=10" allow="autoplay; camera; microphone" title="Final Selection 026"></iframe>
<script>
(function(){
 const frame=document.getElementById('game');
 frame.addEventListener('load',()=>{
   try{
     const doc=frame.contentDocument;
     if(!doc) return;

     if(!doc.getElementById('phone-fit-v10')){
       const link=doc.createElement('link');
       link.id='phone-fit-v10'; link.rel='stylesheet'; link.href='/fit.css?v=10';
       doc.head.appendChild(link);
     }

     if(!doc.getElementById('camera-fix-v10')){
       const fix=doc.createElement('script');
       fix.id='camera-fix-v10';
       fix.textContent=`
(function(){
  function updateScene2Progress(){
    if(S.i!==1)return;
    const keys=['blue','pink','yellow','green'];
    const n=keys.filter(k=>S.pics[k]).length;
    const actions=document.querySelector('.scene1 .actions');
    if(actions){
      const buttons=actions.querySelectorAll('button');
      const nextBtn=buttons[buttons.length-1];
      if(nextBtn) nextBtn.disabled=(n!==4);
    }
    let hint=document.querySelector('.scene1 .centerHint');
    if(n<4){
      if(hint) hint.textContent='尚未完成：'+(4-n)+' 个呼吸痕迹。';
    }else if(hint){
      hint.textContent='四式呼吸痕迹已完成。';
    }
  }

  const originalSync=typeof sync==='function'?sync:null;
  sync=function(){
    if(originalSync) originalSync();
    updateScene2Progress();
  };

  gotPhoto=function(k,input){
    const f=input.files&&input.files[0];
    if(!f)return;

    const finish=function(data){
      S.pics[k]=data;
      const shot=input.closest('.shot');
      if(shot){
        const ph=shot.querySelector('.ph');
        if(ph) ph.innerHTML='<img src="'+data+'">';
        const btn=shot.querySelector('.cam');
        if(btn) btn.textContent='RETAKE';
      }
      input.value='';
      try{save()}catch(e){}
      sync();
    };

    const fallback=function(){
      const r=new FileReader();
      r.onload=function(){finish(r.result)};
      r.readAsDataURL(f);
    };

    try{
      const url=URL.createObjectURL(f);
      const img=new Image();
      img.onload=function(){
        try{
          const max=700;
          let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
          const s=Math.min(1,max/Math.max(w,h));
          w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
          const c=document.createElement('canvas'); c.width=w; c.height=h;
          const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
          const data=c.toDataURL('image/jpeg',0.62);
          URL.revokeObjectURL(url);
          finish(data);
        }catch(e){URL.revokeObjectURL(url);fallback()}
      };
      img.onerror=function(){URL.revokeObjectURL(url);fallback()};
      img.src=url;
    }catch(e){fallback()}
  };
})();`;
       doc.body.appendChild(fix);
     }
   }catch(e){console.error(e)}
 });
})();
</script>
</body>
</html>
