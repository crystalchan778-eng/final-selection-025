<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Final Selection 026</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050609;overflow:hidden}
body{display:grid;place-items:center}
#game{display:block;width:100%;height:100svh;border:0;background:#050609}
@supports not (height:100svh){#game{height:100vh}}
</style>
</head>
<body>
<iframe id="game" src="/index.html" allow="autoplay; camera; microphone" title="Final Selection 026"></iframe>
<script>
(function(){
  const frame=document.getElementById('game');
  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      if(!doc || doc.getElementById('fit-9x16-css')) return;
      const link=doc.createElement('link');
      link.id='fit-9x16-css';
      link.rel='stylesheet';
      link.href='/fit.css?v=2';
      doc.head.appendChild(link);
    }catch(e){console.error('9:16 layout patch failed',e)}
  });
})();
</script>
</body>
</html>
